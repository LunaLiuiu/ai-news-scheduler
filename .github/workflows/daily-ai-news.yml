name: Daily AI News

on:
  schedule:
    # UTC 1:10 = 北京时间 9:10
    - cron: '10 1 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  fetch-ai-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub Trending AI Projects
        run: |
          echo "=== GitHub Trending AI Projects ===" > report.md
          echo "Date: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')" >> report.md
          echo "" >> report.md

          # 获取 trending 仓库（机器学习 + AI 相关）
          echo "--- Trending Repositories (ML/AI) ---" >> report.md
          curl -s "https://api.github.com/search/repositories?q=topic:ai+topic:machine-learning+topic:llm+topic:deep-learning&sort=stars&order=desc&per_page=10" \
            | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              items = data.get('items', [])[:10]
              if not items:
                  print('No results found.')
              for i, r in enumerate(items, 1):
                  print(f\"{i}. **{r['full_name']}** ⭐{r['stargazers_count']}  \")
                  print(f\"   {r.get('description','No description')}\")
                  print(f\"   🔗 {r['html_url']}\")
                  print()
          except Exception as e:
              print(f'Error: {e}')
          " >> report.md
          echo "" >> report.md

          # 获取最近 AI 相关的最新 release
          echo "--- Latest AI Releases ---" >> report.md
          curl -s "https://api.github.com/search/repositories?q=ai+llm+language:python&sort=updated&order=desc&per_page=5" \
            | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              items = data.get('items', [])[:5]
              if not items:
                  print('No results found.')
              for i, r in enumerate(items, 1):
                  print(f\"{i}. **{r['full_name']}** ⭐{r['stargazers_count']}  \")
                  print(f\"   Updated: {r['updated_at'][:10]}\")
                  print(f\"   {r.get('description','No description')}\")
                  print(f\"   🔗 {r['html_url']}\")
                  print()
          except Exception as e:
              print(f'Error: {e}')
          " >> report.md
          echo "" >> report.md

          # 获取 AI 相关的 LLM 项目
          echo "--- Hot LLM Projects ---" >> report.md
          curl -s "https://api.github.com/search/repositories?q=llm+gpt+transformer&sort=stars&order=desc&per_page=5" \
            | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              items = data.get('items', [])[:5]
              if not items:
                  print('No results found.')
              for i, r in enumerate(items, 1):
                  print(f\"{i}. **{r['full_name']}** ⭐{r['stargazers_count']}  \")
                  print(f\"   {r.get('description','No description')}\")
                  print(f\"   🔗 {r['html_url']}\")
                  print()
          except Exception as e:
              print(f'Error: {e}')
          " >> report.md

      - name: Save Report
        run: |
          # 按日期归档
          DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          mkdir -p reports
          cp report.md "reports/${DATE}.md"

          # 更新 latest 指针
          cp report.md latest.md

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "📰 AI News $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          git push
